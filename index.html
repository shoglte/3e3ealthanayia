<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وأن ليس للإنسان إلا ما سعى</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="quranAudio" src="https://www.image2url.com/r2/default/audio/1779519684387-6f3d520f-def6-4866-8c75-0637f9a066fe.mp3" autoplay loop></audio>

    <div class="bg-container"></div>

    <div class="main-wrapper">
        <h1 class="title" id="mainTitle">الوقت المتبقي اول امتحان ثانوية العامة</h1>
        
        <div class="countdown-container" id="countdownBox">
            <div class="time-box">
                <span class="time-number" id="days">00</span>
                <span class="time-label">أيام</span>
            </div>
            <div class="time-box">
                <span class="time-number" id="hours">00</span>
                <span class="time-label">ساعات</span>
            </div>
            <div class="time-box">
                <span class="time-number" id="minutes">00</span>
                <span class="time-label">دقائق</span>
            </div>
            <div class="time-box">
                <span class="time-number" id="seconds">00</span>
                <span class="time-label">ثواني</span>
            </div>
        </div>

        <div class="battle-message" id="battleMsg">بَدَأَتِ المَعْرَكَةُ، بِالتَّوْفِيقِ يَا بَطَلْ!</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
